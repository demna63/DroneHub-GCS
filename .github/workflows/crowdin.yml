# DroneHub GCS — Crowdin sync (upload sources, download ka translations, open PR).
#
# Requires repository secrets: CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
# Setup: tools/CROWDIN.md
#
# upload_translations is off for scheduled runs — Crowdin stays the source of truth.
# After fixing translations in the repo, run this workflow manually with push_translations=true
# so the fixes reach Crowdin and the next weekly download does not revert them.

name: DroneHub Crowdin Sync

on:
  # Weekly auto-sync: pull latest Georgian translations from Crowdin and open a PR.
  # Cron is UTC; 03:00 Sun UTC ≈ 07:00 Sun Tbilisi. Scheduled runs use master.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to sync with Crowdin'
        required: false
        default: 'master'
      push_translations:
        description: 'Also upload repo translations to Crowdin and approve them (one-off, after fixing translations in the repo)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdin:
    name: sync qgc_ka.ts with Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}

      - name: Validate qgc_ka.ts
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          path = 'translations/qgc_ka.ts'
          tree = ET.parse(path)
          root = tree.getroot()
          if root.tag != 'TS':
              sys.exit('not a Qt TS file')
          if root.get('sourcelanguage') != 'en':
              sys.exit('expected sourcelanguage=en')
          msgs = root.findall('.//message')
          print(f'OK: {len(msgs)} messages, language={root.get(\"language\")}')
          "

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: true
          # Normally false so Crowdin is the source of truth. The manual push_translations run
          # sends repo fixes (e.g. #51 terminology) up and approves them, so the next download
          # does not revert them.
          upload_translations: ${{ github.event.inputs.push_translations == 'true' }}
          auto_approve_imported: ${{ github.event.inputs.push_translations == 'true' }}
          # Strings that stay English on purpose have translation == source; without this
          # Crowdin skips them on upload and keeps its machine translation (Crowdin PR #56).
          import_eq_suggestions: ${{ github.event.inputs.push_translations == 'true' }}
          download_translations: true
          localization_branch_name: l10n/crowdin-ka
          create_pull_request: true
          pull_request_title: 'chore(l10n): Crowdin Georgian translations'
          pull_request_body: |
            Automated Crowdin download for `translations/qgc_ka.ts`.

            Review for:
            - Flight-mode / Roll-Pitch-Yaw strings remain English
            - Placeholders (`%1`, `&apos;`, …) preserved
            - UI terminology consistency

            Synced by [crowdin/github-action](https://github.com/crowdin/github-action).
          pull_request_base_branch_name: master
          commit_message: 'chore(l10n): sync qgc_ka.ts from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
