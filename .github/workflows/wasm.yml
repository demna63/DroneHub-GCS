# DroneHub GCS — WebAssembly (WASM) custom build CI (F5).
#
# აშენებს custom build-ს WebAssembly-სთვის Linux host-ზე Emscripten-ით.
# Qt ვერსია მოდის env.QT_VERSION-იდან (6.11.1). ⚠️ QGC v5.1 upstream-ს WASM build აღარ აქვს
# (არც workflow, არც EMSCRIPTEN branch CMake-ში) — ეს job ექსპერიმენტულია და, სავარაუდოდ,
# configure-ზევე ჩავარდება. EMSDK_VERSION Qt 6.11-ის შესაბამისად გადასამოწმებელია.
#
# ბრაუზერის უსაფრთხოების შეზღუდვების გამო:
# 1. GStreamer ვიდეო სტრიმინგი გათიშულია (-DQGC_ENABLE_GST_VIDEOSTREAMING=OFF).
# 2. სერიული პორტები გათიშულია (-DQGC_NO_SERIAL_LINK=ON).
#
# ბილდი ექსპერიმენტულია და პირველ ეტაპზე დაგვეხმარება კომპილაციის შეცდომების პოვნაში.

name: DroneHub WASM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: 'master'
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        type: string
        default: 'master'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QGC_TAG: v5.1.5
  QT_VERSION: 6.11.1
  EMSDK_VERSION: 3.1.56

jobs:
  wasm:
    name: WebAssembly (WASM, multithread)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DroneHub
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main @ 2026-10-08
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Clone QGroundControl (${{ env.QGC_TAG }}) + wire custom/
        shell: bash
        run: |
          git clone --recursive --branch "$QGC_TAG" --depth 1 \
            https://github.com/mavlink/qgroundcontrol.git qgroundcontrol
          rm -rf qgroundcontrol/custom
          cp -R custom qgroundcontrol/custom
          cp translations/qgc_ka.ts qgroundcontrol/translations/qgc_ka.ts
          cp translations/qgc_ka.ts qgroundcontrol/translations/qgc_source_ka.ts
          if [ ! -f qgroundcontrol/custom/res/fonts/NotoSansGeorgian.ttf ]; then
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansgeorgian/NotoSansGeorgian%5Bwdth%2Cwght%5D.ttf" \
              -o qgroundcontrol/custom/res/fonts/NotoSansGeorgian.ttf
          fi

      - name: Setup Emscripten SDK (${{ env.EMSDK_VERSION }})
        uses: emscripten-core/setup-emsdk@v11
        with:
          version: ${{ env.EMSDK_VERSION }}
          no-cache: true

      - name: Verify emcc version
        shell: bash
        run: emcc --version

      - name: Install host Qt (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3.0 (PyPI) can't read Qt >= 6.11 per-arch Windows repos; pin master commit.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          modules: qtgraphs qtlocation qtpositioning qtspeech qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors qtscxml qtwebsockets qthttpserver
          setup-python: false
          cache: true

      - name: Install WASM Qt (wasm_multithread)
        uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3.0 (PyPI) can't read Qt >= 6.11 per-arch Windows repos; pin master commit.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_multithread
          dir: ${{ runner.temp }}
          modules: qtgraphs qtlocation qtpositioning qtspeech qtmultimedia qtimageformats qtshadertools qtquick3d qtsensors qtscxml qtwebsockets
          setup-python: false
          cache: true

      - name: Configure (WASM custom build)
        working-directory: qgroundcontrol
        shell: bash
        run: |
          chmod +x "${QT_ROOT_DIR}/bin/qt-cmake"
          "${QT_ROOT_DIR}/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_WARN_DEPRECATED=FALSE \
            -DQGC_CUSTOM_BUILD=ON \
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF \
            -DQGC_NO_SERIAL_LINK=ON \
            -DQT_HOST_PATH="${QT_ROOT_DIR}/../gcc_64" \
            -DQt6LinguistTools_DIR="${QT_ROOT_DIR}/../gcc_64/lib/cmake/Qt6LinguistTools"

      - name: Build
        working-directory: qgroundcontrol
        shell: bash
        run: cmake --build build --config Release

      - name: Upload WASM artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: DroneHubGCS-WASM
          path: qgroundcontrol/build/**/*
          if-no-files-found: warn
