# DroneHub GCS — Android custom build CI (F5).
#
# აშენებს custom build-ს Android-ისთვის (arm64-v8a, unsigned) Linux host-ზე.
# ცალკე workflow-ია (არა build.yml-ში) — Android-ის იტერაციაზე desktop matrix
# არ ეშვება (CI minutes). მოდელირებულია upstream qt-android composite action-ზე
# (qgroundcontrol/.github/actions/qt-android) — inline, რადგან composite ჩვენს
# checkout-ში არ არის.
#
# unsigned APK (QT_ANDROID_SIGN_APK=OFF) — keystore secrets არ სჭირდება, verification-ს.

name: DroneHub Android

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: 'master'
      sign:
        description: 'Sign the APK (needs ANDROID_KEYSTORE_BASE64 secret)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        type: string
        default: 'master'
      sign:
        description: 'Sign the APK (needs keystore secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QGC_TAG: v5.1.5
  QT_VERSION: 6.11.1
  QT_ANDROID_ABIS: arm64-v8a

jobs:
  android:
    name: android (arm64-v8a, unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DroneHub
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main @ 2026-10-08
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Clone QGroundControl (${{ env.QGC_TAG }}) + wire custom/
        shell: bash
        run: |
          git clone --recursive --branch "$QGC_TAG" --depth 1 \
            https://github.com/mavlink/qgroundcontrol.git qgroundcontrol
          rm -rf qgroundcontrol/custom
          cp -R custom qgroundcontrol/custom
          cp translations/qgc_ka.ts qgroundcontrol/translations/qgc_ka.ts
          # 5.1 QGCApplication::setLanguage() loads :/i18n/qgc_source_<locale>.qm — needs this name too.
          cp translations/qgc_ka.ts qgroundcontrol/translations/qgc_source_ka.ts
          if [ ! -f qgroundcontrol/custom/res/fonts/NotoSansGeorgian.ttf ]; then
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansgeorgian/NotoSansGeorgian%5Bwdth%2Cwght%5D.ttf" \
              -o qgroundcontrol/custom/res/fonts/NotoSansGeorgian.ttf
          fi

      - name: Setup Java (21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK (r27c for Qt 6.11)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Export NDK env
        shell: bash
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install host Qt (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3.0 (PyPI) can't read Qt >= 6.11 per-arch Windows repos; pin master commit.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          modules: qtgraphs qtlocation qtpositioning qtspeech qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors qtscxml qtwebsockets qthttpserver
          setup-python: false
          cache: true

      - name: Install Android Qt (arm64_v8a)
        uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3.0 (PyPI) can't read Qt >= 6.11 per-arch Windows repos; pin master commit.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          version: ${{ env.QT_VERSION }}
          # Qt >= 6.7 publishes Android packages under the 'all_os' host in the online repo.
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}
          modules: qtgraphs qtlocation qtpositioning qtspeech qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors qtscxml qtwebsockets qthttpserver
          setup-python: false
          cache: true

      # Decode the keystore only when signing is requested AND the secret exists,
      # then export the env vars Qt's androiddeployqt reads during the build.
      # GITHUB_ENV persists these to later steps. No-op otherwise → unsigned APK.
      - name: Prepare Android signing
        if: inputs.sign && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/dronehub.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$KS"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEYSTORE_ALIAS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_STORE_PASS"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=${ANDROID_KEYSTORE_KEY_PASS:-$ANDROID_KEYSTORE_STORE_PASS}"
            echo "DRONEHUB_SIGN_APK=ON"
          } >> "$GITHUB_ENV"
          echo "Android signing enabled."

      - name: Configure (Android custom build)
        working-directory: qgroundcontrol
        shell: bash
        # QT_ROOT_DIR → ბოლო install-qt-action (android_arm64_v8a). host Qt გვერდითაა (../gcc_64).
        # SIGN_APK ON მხოლოდ მაშინ, თუ "Prepare Android signing" step-მა keystore გაშალა.
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_WARN_DEPRECATED=FALSE \
            -DQGC_CUSTOM_BUILD=ON \
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF \
            -DQT_ANDROID_ABIS="${QT_ANDROID_ABIS}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${QT_ROOT_DIR}/../gcc_64" \
            -DQT_ANDROID_SIGN_APK="${DRONEHUB_SIGN_APK:-OFF}"

      - name: Build APK
        working-directory: qgroundcontrol
        shell: bash
        run: cmake --build build --config Release

      # Unsigned release APKs cannot be installed at all. When no release keystore was used,
      # sign with a throwaway test key so the artifact is directly installable for testing.
      # (Not for Play: a real release must use ANDROID_KEYSTORE_BASE64.)
      - name: Make installable APK
        working-directory: qgroundcontrol
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          SRC="$(find build/android-build -name '*.apk' -path '*release*' | head -n1)"
          [ -n "$SRC" ] || SRC="$(find build/android-build -name '*.apk' | head -n1)"
          mkdir -p "$RUNNER_TEMP/apk-out"
          OUT="$RUNNER_TEMP/apk-out/DroneHubGCS-arm64-v8a.apk"
          if "$BT/apksigner" verify "$SRC" >/dev/null 2>&1; then
            cp "$SRC" "$OUT"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass dronehub -keypass dronehub \
              -alias dhtest -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DroneHub Test" >/dev/null
            "$BT/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:dronehub --key-pass pass:dronehub \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            echo "::notice::APK signed with a throwaway TEST key (installable, not for Play)"
          fi
          "$BT/apksigner" verify "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      # Single APK per artifact (the old glob shipped the same APK twice → ~290 MB zip that
      # Android's Files app failed to extract).
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: DroneHubGCS-android-arm64-v8a
          path: ${{ env.APK_OUT }}
          compression-level: 0
          if-no-files-found: error
